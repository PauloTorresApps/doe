services:
  postgres:
    image: postgres:15-alpine
    container_name: doe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doe_user
      POSTGRES_PASSWORD: doe_password
      POSTGRES_DB: doe_tocantins
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doe_user -d doe_tocantins"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doe-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: doe_postgres_data
  redis_data:
    name: doe_redis_data
